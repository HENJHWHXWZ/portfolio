name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    # Pin the OS while troubleshooting the intermittent blank desktop.
    runs-on: windows-2022
    # GitHub-hosted standard runners do not support a 3600-minute job.
    timeout-minutes: 360

    steps:
      - name: Create RDP user and configure RDP securely
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Generate a fresh password with upper/lower/digit/special characters.
          $upper   = 'ABCDEFGHJKLMNPQRSTUVWXYZ'.ToCharArray()
          $lower   = 'abcdefghijkmnopqrstuvwxyz'.ToCharArray()
          $digits  = '23456789'.ToCharArray()
          $special = '!@#$%_-+='.ToCharArray()
          $pool = $upper + $lower + $digits + $special

          $passwordChars = @(
            (Get-Random -InputObject $upper)
            (Get-Random -InputObject $lower)
            (Get-Random -InputObject $digits)
            (Get-Random -InputObject $special)
          )
          for ($i = 0; $i -lt 20; $i++) {
            $passwordChars += Get-Random -InputObject $pool
          }
          $password = -join ($passwordChars | Sort-Object { Get-Random })
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force

          # This is a new GitHub-hosted VM for each run, so the account should not exist yet.
          if (Get-LocalUser -Name 'maxxciey' -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name 'maxxciey'
          }
          New-LocalUser -Name 'maxxciey' `
            -Password $securePassword `
            -PasswordNeverExpires `
            -AccountNeverExpires `
            -Description 'Temporary RDP account' | Out-Null

          Add-LocalGroupMember -Group 'Administrators' -Member 'maxxciey'
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'maxxciey'

          # Keep the generated credential available to later steps without printing it here.
          Add-Content -Path $env:GITHUB_ENV -Value "RDP_PASSWORD=$password"
          $securePassword = $null
          $passwordChars = $null
          $password = $null

          # Enable RDP and retain standard RDP security protections.
          $rdpTcp = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force
          Set-ItemProperty -Path $rdpTcp -Name 'UserAuthentication' -Value 1 -Force
          Set-ItemProperty -Path $rdpTcp -Name 'SecurityLayer' -Value 1 -Force
          Set-ItemProperty -Path $rdpTcp -Name 'MinEncryptionLevel' -Value 3 -Force

          # Normalize the standard Windows logon shell. This will not repair a hung session,
          # but prevents a nonstandard Shell/Userinit value from producing a shell-less desktop.
          $winlogon = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          Set-ItemProperty -Path $winlogon -Name 'Shell' -Value 'explorer.exe' -Force
          Set-ItemProperty -Path $winlogon -Name 'Userinit' `
            -Value "$env:SystemRoot\system32\userinit.exe," -Force

          # Use a dedicated firewall rule limited to Tailscale's 100.64.0.0/10 address range.
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule -ErrorAction SilentlyContinue
          Get-NetFirewallRule -Name 'RDP-Tailscale' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule `
            -Name 'RDP-Tailscale' `
            -DisplayName 'RDP through Tailscale only' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any | Out-Null

          # Restart once during setup, before the user connects. Do not periodically restart it.
          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 5

          $service = Get-Service -Name TermService
          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          if ($service.Status -ne 'Running') {
            throw "Remote Desktop Services is not running (status: $($service.Status))."
          }
          if (-not $listener) {
            throw 'RDP TCP port 3389 is not listening after configuration.'
          }

          Write-Host 'RDP user created; NLA enabled; dedicated Tailscale firewall rule configured.'
          Write-Host 'RDP service and TCP listener are running.'

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Missing repository secret TAILSCALE_AUTH_KEY.'
          }

          $installerPath = Join-Path $env:TEMP 'tailscale-setup.msi'
          $installerUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.102.3-amd64.msi'
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing

          $install = Start-Process -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$installerPath`" /qn /norestart" `
            -Wait -PassThru
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed with exit code $($install.ExitCode)."
          }

          $tailscaleExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          if (-not (Test-Path $tailscaleExe)) {
            throw "Tailscale executable not found at $tailscaleExe."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_EXE=$tailscaleExe"
          Write-Host 'Tailscale installed.'
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Connect to Tailscale and verify RDP reachability
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscaleExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $hostname = "gh-rdp-$env:GITHUB_RUN_ID"

          # For best hygiene, configure TAILSCALE_AUTH_KEY as reusable + ephemeral,
          # with a tag permitted by your tailnet policy.
          & $tailscaleExe up "--authkey=$($env:TAILSCALE_AUTH_KEY.Trim())" "--hostname=$hostname"
          if ($LASTEXITCODE -ne 0) {
            throw "tailscale up failed with exit code $LASTEXITCODE."
          }

          $tsIP = ''
          for ($i = 0; $i -lt 20 -and [string]::IsNullOrWhiteSpace($tsIP); $i++) {
            Start-Sleep -Seconds 3
            $ipOutput = & $tailscaleExe ip -4 2>$null
            if ($LASTEXITCODE -eq 0) {
              $tsIP = [string]($ipOutput | Select-Object -First 1)
              $tsIP = $tsIP.Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($tsIP)) {
            & $tailscaleExe status 2>&1 | ForEach-Object { Write-Host $_ }
            throw 'Tailscale did not assign an IPv4 address within 60 seconds.'
          }

          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          if (-not $listener) {
            throw 'RDP port 3389 is no longer listening.'
          }

          Add-Content -Path $env:GITHUB_ENV -Value "TAILSCALE_IP=$tsIP"
          Write-Host "Tailscale IPv4: $tsIP"
          Write-Host "RDP endpoint: $tsIP`:3389"
          Write-Host 'RDP listener is present. This confirms the local listener, not that an interactive desktop login has succeeded.'
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Install MetaTrader 5 (Deriv) and Visual Studio Code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          # MetaTrader 5 - Deriv installer.
          # Keep this install non-fatal: an MT5 bootstrapper failure must not terminate
          # the job and destroy the RDP session. Verify the terminal instead of trusting
          # the installer exit code alone, and print diagnostics if it was not installed.
          $mt5Url = 'https://download.mql5.com/cdn/web/deriv.com.limited/mt5/deriv5setup.exe'
          $mt5Path = Join-Path $env:TEMP 'deriv5setup.exe'
          $mt5ExitCode = 'not-started'
          $mt5Terminal = $null
          try {
            Invoke-WebRequest -Uri $mt5Url -OutFile $mt5Path -UseBasicParsing
            $mt5File = Get-Item $mt5Path -ErrorAction Stop
            Write-Host "Downloaded Deriv MT5 bootstrapper: $($mt5File.Length) bytes."
            if ($mt5File.Length -lt 100KB) {
              throw "Downloaded installer is unexpectedly small ($($mt5File.Length) bytes)."
            }
            $signature = Get-AuthenticodeSignature -FilePath $mt5Path
            Write-Host "MT5 installer signature status: $($signature.Status)"

            $mt5 = Start-Process -FilePath $mt5Path -ArgumentList '/auto' -Wait -PassThru
            $mt5ExitCode = [string]$mt5.ExitCode
            Write-Host "Deriv MT5 installer process exit code: $mt5ExitCode"

            # Check common installation locations. The terminal may be installed even
            # if the bootstrapper reports a non-zero process code.
            $candidatePaths = @(
              'C:\Program Files\Deriv MT5\terminal64.exe',
              'C:\Program Files (x86)\Deriv MT5\terminal64.exe',
              'C:\Program Files\MetaTrader 5\terminal64.exe',
              'C:\Program Files (x86)\MetaTrader 5\terminal64.exe'
            )
            $mt5Terminal = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $mt5Terminal) {
              foreach ($root in @('C:\Program Files', 'C:\Program Files (x86)')) {
                if (Test-Path $root) {
                  $found = Get-ChildItem -Path $root -Filter 'terminal64.exe' -File -Recurse -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match 'Deriv|MetaTrader|MT5' } |
                    Select-Object -First 1
                  if ($found) {
                    $mt5Terminal = $found.FullName
                    break
                  }
                }
              }
            }

            if ($mt5Terminal) {
              Write-Host "Deriv/MetaTrader terminal found: $mt5Terminal"
              Add-Content -Path $env:GITHUB_ENV -Value 'MT5_INSTALL_STATUS=installed'
              Add-Content -Path $env:GITHUB_ENV -Value "MT5_TERMINAL_PATH=$mt5Terminal"
            } else {
              Write-Warning "MT5 terminal was not found after installer exit code $mt5ExitCode. Continuing so RDP stays available; MT5 may need to be installed manually in the session."
              Add-Content -Path $env:GITHUB_ENV -Value "MT5_INSTALL_STATUS=not-confirmed_exit_$mt5ExitCode"
            }
          } catch {
            Write-Warning "MT5 automatic installation failed: $($_.Exception.Message)"
            Write-Warning 'Continuing the workflow so an MT5 installer failure does not terminate the RDP session.'
            Add-Content -Path $env:GITHUB_ENV -Value 'MT5_INSTALL_STATUS=failed'
          } finally {
            Remove-Item $mt5Path -Force -ErrorAction SilentlyContinue
          }

          # Download the current stable VS Code user-independent installer.
          $vscodeUrl = 'https://update.code.visualstudio.com/latest/win32-x64/stable'
          $vscodePath = Join-Path $env:TEMP 'vscode-setup.exe'
          Invoke-WebRequest -Uri $vscodeUrl -OutFile $vscodePath -UseBasicParsing
          $vscode = Start-Process -FilePath $vscodePath `
            -ArgumentList @('/VERYSILENT', '/NORESTART', '/ALLUSERS', '/MERGETASKS=!runcode,addcontextmenufiles,addcontextmenufolders,addtopath') `
            -Wait -PassThru
          Remove-Item $vscodePath -Force -ErrorAction SilentlyContinue
          if ($vscode.ExitCode -ne 0) {
            throw "VS Code installer exited with code $($vscode.ExitCode)."
          }

          if (-not (Test-Path 'C:\Program Files\Microsoft VS Code\Code.exe')) {
            throw 'VS Code installation could not be verified at C:\Program Files\Microsoft VS Code\Code.exe.'
          }
          Write-Host 'VS Code installation confirmed.'

      - name: Clone repository into maxxciey's Downloads folder
        shell: powershell
        env:
          GTOKEN: ${{ secrets.GTOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GTOKEN)) {
            throw 'Missing repository secret GTOKEN. It must have read access to the target repository.'
          }

          $repoUrl = 'https://github.com/Techtoxic/Oopus4.8-advanced-deriv-trading-algos-2026.git'
          $downloadsDir = 'C:\Users\maxxciey\Downloads'
          New-Item -ItemType Directory -Path $downloadsDir -Force | Out-Null
          $cloneDir = Join-Path $downloadsDir 'Oopus4.8-advanced-deriv-trading-algos-2026'

          if (Test-Path $cloneDir) {
            Remove-Item $cloneDir -Recurse -Force
          }

          $token = $env:GTOKEN.Trim()
          $authBytes = [System.Text.Encoding]::ASCII.GetBytes("x-access-token:$token")
          $auth = [Convert]::ToBase64String($authBytes)
          $token = $null
          $authBytes = $null

          & git -c "http.extraheader=AUTHORIZATION: basic $auth" clone `
            --branch fable-thoughts `
            --single-branch `
            $repoUrl `
            $cloneDir
          $gitExitCode = $LASTEXITCODE
          $auth = $null

          if ($gitExitCode -ne 0 -or -not (Test-Path (Join-Path $cloneDir '.git'))) {
            throw 'Repository clone failed. Check GTOKEN permissions and that the fable-thoughts branch exists.'
          }

          Write-Host 'Repository cloned successfully.'
          Write-Host 'Repository: Oopus4.8-advanced-deriv-trading-algos-2026'
          Write-Host 'Branch: fable-thoughts'
          Write-Host "Location: $cloneDir"

      - name: Print RDP connection details
        shell: powershell
        run: |
          Write-Host ''
          Write-Host '============== RDP ACCESS =============='
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host 'Username: .\maxxciey'
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host 'Port:     3389'
          Write-Host '========================================'
          Write-Host 'Anyone with access to this Actions log may be able to view this generated password.'

      - name: Monitor RDP without disrupting active sessions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $tailscaleExe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          $iteration = 0

          Write-Host 'Starting RDP health monitor. It will NOT restart TermService just because a listener check fails.'
          while ($true) {
            $iteration++
            $now = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
            $service = Get-Service -Name TermService -ErrorAction SilentlyContinue
            $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
            $tailscaleStatus = 'unavailable'
            if (Test-Path $tailscaleExe) {
              $tailscaleStatus = (& $tailscaleExe status 2>&1 | Out-String).Trim()
            }

            Write-Host "[$now] TermService=$($service.Status); TCP3389Listening=$([bool]$listener); TailscaleIP=$env:TAILSCALE_IP"
            if ($service -and $service.Status -ne 'Running') {
              Write-Warning "TermService status is $($service.Status); attempting Start-Service (not a forced restart)."
              try {
                Start-Service -Name TermService -ErrorAction Stop
                Start-Sleep -Seconds 5
              } catch {
                Write-Warning "Could not start TermService: $($_.Exception.Message)"
              }
            }
            if (-not $listener) {
              Write-Warning 'TCP 3389 listener is missing. No forced service restart was issued to avoid breaking a live session.'
            }

            # Every five minutes, record whether a desktop shell is present and review recent logon errors.
            if (($iteration % 5) -eq 0) {
              Write-Host '--- Session list (quser) ---'
              & "$env:SystemRoot\System32\quser.exe" 2>&1 | ForEach-Object { Write-Host $_ }

              Write-Host '--- Explorer processes by session ---'
              Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
                Select-Object ProcessId, ParentProcessId, SessionId, CommandLine |
                Format-Table -AutoSize | Out-String | ForEach-Object { Write-Host $_ }

              Write-Host '--- Recent RDP/profile/shell errors ---'
              $recent = Get-WinEvent -FilterHashtable @{
                LogName = 'Application'
                StartTime = (Get-Date).AddMinutes(-10)
              } -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ProviderName -match 'Winlogon|User Profile Service|Application Error|Windows Error Reporting' -and
                  $_.Message -match 'explorer|userinit|profile|logon|remote desktop'
                } |
                Select-Object -First 5 TimeCreated, Id, ProviderName, Message
              if ($recent) {
                $recent | Format-List | Out-String | ForEach-Object { Write-Host $_ }
              } else {
                Write-Host 'No matching recent Application log errors found.'
              }
            }

            Start-Sleep -Seconds 60
          }
